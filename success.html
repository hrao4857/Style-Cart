<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order received | StyleCart</title><style>
:root{--ink:#1f2523;--muted:#737b76;--cream:#f7f5ef;--green:#244b3b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:var(--cream);min-height:100vh;display:grid;place-items:center;padding:20px}.success{background:white;padding:clamp(28px,7vw,65px);max-width:600px;width:100%;text-align:center}.mark{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:#e9f2e9;color:#244b3b;font-size:28px;margin:0 auto 25px}.eyebrow{font-size:11px;letter-spacing:2px;color:#66866e;font-weight:700}.success h1{font-size:clamp(32px,6vw,46px);letter-spacing:-1.5px;line-height:1.05}.desc{color:var(--muted);font-size:14px;line-height:1.7}.details{background:var(--cream);padding:16px;margin:25px 0;font-size:13px;line-height:1.8}.button{display:inline-block;background:var(--green);color:white;padding:15px 20px;text-decoration:none;font-size:13px}.fine{font-size:11px;color:var(--muted);line-height:1.6;margin-top:25px}
</style></head><body><main class="success"><div class="mark">✓</div><p class="eyebrow">THANK YOU FOR SHOPPING</p><h1>Your order is on its way to us.</h1><p class="desc">Your order request has been submitted. The store will review the details and confirm availability.</p><div id="details" class="details"></div><a class="button" href="index.html">Continue shopping →</a><p class="fine">If the order does not appear in the store's Google Sheet, please contact the store before assuming it is confirmed.</p></main>
<script>
const el=document.getElementById('details');try{const o=JSON.parse(localStorage.getItem('stylecart_last_order')||'null');if(o)el.innerHTML=`<b>Order ID: ${o.orderId}</b><br>Total: ₹${Number(o.total).toLocaleString('en-IN')}<br>Payment: Cash on Delivery`}else el.textContent='Order details are not available in this browser.'}catch(e){el.textContent='Order details are not available in this browser.'}
</script>
</body></html>
