<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | StyleCart</title><style>
:root{--ink:#1f2523;--muted:#737b76;--cream:#f7f5ef;--line:#e7e4dc;--green:#244b3b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.topbar{height:70px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:#66866e}nav{display:flex;gap:24px;font-size:14px}nav b{background:var(--green);color:#fff;border-radius:20px;padding:3px 7px}.detailWrap{padding:28px 7% 70px}.back{font-size:13px;color:var(--muted)}.detail{display:grid;grid-template-columns:1.1fr .9fr;gap:55px;margin-top:24px}.galleryMain{width:100%;height:510px;object-fit:cover;background:var(--cream)}.thumbs{display:flex;gap:10px;margin-top:10px}.thumb{width:82px;height:90px;object-fit:cover;cursor:pointer;border:2px solid transparent}.thumb.active{border-color:var(--green)}.eyebrow{font-size:11px;letter-spacing:2px;color:#66866e;font-weight:700}.info h1{font-size:38px;letter-spacing:-1.5px;margin:10px 0}.price{font-size:22px;font-weight:700}.desc{color:var(--muted);line-height:1.7;font-size:14px}.label{display:block;font-size:12px;font-weight:700;margin:25px 0 10px}.sizes{display:flex;gap:8px;flex-wrap:wrap}.sizeBtn{border:1px solid var(--line);background:#fff;padding:12px 16px;cursor:pointer}.sizeBtn.selected{border-color:var(--green);background:#eef3ee}.qtyRow{display:flex;align-items:center;gap:14px;margin-top:22px;font-size:13px}.qtyRow input{width:70px;padding:11px;border:1px solid var(--line)}.addBtn{width:100%;padding:16px;background:var(--green);color:white;border:0;margin-top:20px;font-size:13px;cursor:pointer}.note{background:var(--cream);padding:15px;font-size:12px;line-height:1.6;margin-top:18px;color:var(--muted)}footer{padding:25px 7%;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}@media(max-width:700px){.detail{grid-template-columns:1fr;gap:25px}.galleryMain{height:390px}.detailWrap{padding:22px 5% 50px}.info h1{font-size:31px}}
</style></head><body><header class="topbar"><a class="brand" href="index.html">Style<span>Cart</span></a><nav><a href="index.html">Shop</a><a href="cart.html">Bag <b id="cartCount">0</b></a></nav></header><main class="detailWrap"><a class="back" href="index.html">← Back to collection</a><div id="productDetail" class="detail"></div></main><footer>StyleCart · Good style. Simple shopping.</footer>

window.STYLECART_PRODUCTS = [
 {id:"shirt-01",name:"Classic Linen Shirt",category:"Shirts",price:1299,description:"A relaxed everyday shirt with a clean, breathable feel. Easy to style for work or weekends.",sizes:["S","M","L","XL"],images:["https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1603252109303-2751441dd157?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1598033129183-c4f50c736f10?auto=format&fit=crop&w=900&q=85"],color:"Olive"},
 {id:"tee-02",name:"Everyday Premium Tee",category:"T-shirts",price:699,description:"A versatile premium tee with a comfortable fit and minimal design.",sizes:["S","M","L","XL","XXL"],images:["https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=900&q=85"],color:"White"},

 {id:"denim-04",name:"Relaxed Denim",category:"Bottoms",price:1499,description:"An easy relaxed cut made for everyday movement and effortless outfits.",sizes:["28","30","32","34","36"],images:["https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1511196044526-5cb3bcb7071b?auto=format&fit=crop&w=900&q=85"],color:"Blue"}
];

<script>
const params=new URLSearchParams(location.search);const id=params.get('id');const p=(window.STYLECART_PRODUCTS||[]).find(x=>x.id===id)||window.STYLECART_PRODUCTS[0];let selectedSize=p.sizes[0],mainImage=p.images[0];const root=document.getElementById('productDetail');function cart(){try{return JSON.parse(localStorage.getItem('stylecart_cart')||'[]')}catch(e){return[]}}function count(){const e=document.getElementById('cartCount');if(e)e.textContent=cart().reduce((n,x)=>n+x.qty,0)}root.innerHTML=`<div class="gallery"><img id="mainImage" class="galleryMain" src="${p.images[0]}" alt="${p.name}"><div class="thumbs">${p.images.map((im,i)=>`<img class="thumb ${i===0?'active':''}" src="${im}" alt="${p.name} view ${i+1}" data-image="${im}">`).join('')}</div></div><section class="info"><p class="eyebrow">${p.category.toUpperCase()} · ${p.color||'STYLE EDIT'}</p><h1>${p.name}</h1><div class="price">₹${p.price.toLocaleString('en-IN')}</div><p class="desc">${p.description}</p><label class="label">SELECT SIZE</label><div class="sizes">${p.sizes.map((s,i)=>`<button class="sizeBtn ${i===0?'selected':''}" data-size="${s}">${s}</button>`).join('')}</div><div class="qtyRow"><label for="qty">Quantity</label><input id="qty" type="number" min="1" max="10" value="1"></div><button class="addBtn" id="addBtn">ADD TO BAG · ₹${p.price.toLocaleString('en-IN')}</button><div class="note">Free size exchange on eligible items. Please check your size before placing the order. Cash on Delivery available at checkout.</div></section>`;root.querySelectorAll('.thumb').forEach(t=>t.addEventListener('click',()=>{document.getElementById('mainImage').src=t.dataset.image;root.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));t.classList.add('active')}));root.querySelectorAll('.sizeBtn').forEach(b=>b.addEventListener('click',()=>{selectedSize=b.dataset.size;root.querySelectorAll('.sizeBtn').forEach(x=>x.classList.toggle('selected',x===b))}));document.getElementById('addBtn').addEventListener('click',()=>{const qty=Math.max(1,Math.min(10,parseInt(document.getElementById('qty').value)||1));const c=cart();const f=c.find(x=>x.id===p.id&&x.size===selectedSize);if(f)f.qty+=qty;else c.push({id:p.id,name:p.name,price:p.price,image:mainImage,size:selectedSize,qty});localStorage.setItem('stylecart_cart',JSON.stringify(c));count();location.href='cart.html'});count();
</script>
</body></html>
