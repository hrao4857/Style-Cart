<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StyleCart | Everyday style</title><style>
:root{--ink:#1f2523;--muted:#737b76;--cream:#f7f5ef;--line:#e7e4dc;--green:#244b3b;--white:#fff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;background:#fff}a{color:inherit;text-decoration:none}.topbar{height:72px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:#66866e}.topbar nav{display:flex;gap:25px;align-items:center;font-size:14px}.topbar nav b{background:#244b3b;color:#fff;border-radius:20px;padding:3px 7px;font-size:11px}.hero{background:var(--cream);min-height:410px;padding:55px 7%;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#66866e}.hero h1{font-size:clamp(42px,6vw,70px);line-height:.98;letter-spacing:-3px;margin:17px 0}.hero h1 em{font-family:Georgia,serif;font-weight:400;color:#66866e}.heroText{color:var(--muted);max-width:330px;line-height:1.6}.button{display:inline-flex;gap:25px;align-items:center;background:var(--green);color:white;padding:15px 20px;margin-top:15px;border-radius:3px;font-size:13px}.heroPhoto{height:300px;border-radius:4px;background:linear-gradient(0deg,#0002,#0000),url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1000&q=85') center/cover}.wrap{padding:45px 7% 65px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.sectionHead h2{font-size:30px;letter-spacing:-1px;margin:8px 0}.muted{color:var(--muted);font-size:13px}.productGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.productCard{min-width:0}.productCard img{width:100%;height:280px;object-fit:cover;background:var(--cream);display:block}.productCard h3{font-size:14px;margin:12px 0 5px}.productCard p{font-size:13px;color:var(--muted);margin:0 0 12px}.productCard .price{font-weight:700;color:var(--ink)}.cardActions{display:flex;gap:8px}.smallBtn{border:1px solid var(--green);padding:10px 12px;background:white;color:var(--green);font-size:12px;cursor:pointer}.smallBtn.primary{background:var(--green);color:white}footer{border-top:1px solid var(--line);padding:28px 7%;display:flex;align-items:center;justify-content:space-between}footer p{font-size:12px;color:var(--muted)}@media(max-width:700px){.hero{grid-template-columns:1fr;padding:40px 6%}.heroPhoto{height:230px}.productGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.productCard img{height:230px}.wrap{padding:35px 6%}.muted{display:none}.topbar{padding:0 6%}}
</style></head>
<body><header class="topbar"><a class="brand" href="index.html">Style<span>Cart</span></a><nav><a class="active" href="index.html">Home</a><a href="cart.html">Bag <b id="cartCount">0</b></a></nav></header>
<section class="hero"><div><p class="eyebrow">NEW SEASON · NEW YOU</p><h1>Find your<br><em>everyday style.</em></h1><p class="heroText">Easy essentials. Better fits. Made for your everyday.</p><a class="button" href="#products">Shop collection <span>→</span></a></div><div class="heroPhoto" role="img" aria-label="Fashion editorial"></div></section>
<main class="wrap" id="products"><div class="sectionHead"><div><p class="eyebrow">CURATED FOR YOU</p><h2>Popular right now</h2></div><span class="muted">New drops, timeless fits</span></div><div id="productGrid" class="productGrid"></div></main>
<footer><a class="brand" href="index.html">Style<span>Cart</span></a><p>Good style. Simple shopping.</p></footer>
<script>

window.STYLECART_PRODUCTS = [
 {id:"shirt-01",name:"Classic Linen Shirt",category:"Shirts",price:1299,description:"A relaxed everyday shirt with a clean, breathable feel. Easy to style for work or weekends.",sizes:["S","M","L","XL"],images:["https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1603252109303-2751441dd157?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1598033129183-c4f50c736f10?auto=format&fit=crop&w=900&q=85"],color:"Olive"},
 {id:"tee-02",name:"Everyday Premium Tee",category:"T-shirts",price:699,description:"A versatile premium tee with a comfortable fit and minimal design.",sizes:["S","M","L","XL","XXL"],images:["https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=900&q=85"],color:"White"},
 {id:"jacket-03",name:"Utility Overshirt",category:"Outerwear",price:1799,description:"A smart layer with a modern silhouette. Wear it open or buttoned up.",sizes:["S","M","L","XL"],images:["https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1544923246-77307dd654cb?auto=format&fit=crop&w=900&q=85"],color:"Sand"},
 {id:"denim-04",name:"Relaxed Denim",category:"Bottoms",price:1499,description:"An easy relaxed cut made for everyday movement and effortless outfits.",sizes:["28","30","32","34","36"],images:["https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1511196044526-5cb3bcb7071b?auto=format&fit=crop&w=900&q=85"],color:"Blue"}
];
</script>

<script>
const grid=document.getElementById('productGrid');const products=window.STYLECART_PRODUCTS||[];function getCart(){try{return JSON.parse(localStorage.getItem('stylecart_cart')||'[]')}catch(e){return[]}}function updateCount(){const el=document.getElementById('cartCount');if(el)el.textContent=getCart().reduce((n,x)=>n+x.qty,0)}function addToCart(id){const p=products.find(x=>x.id===id);if(!p)return;const cart=getCart();const found=cart.find(x=>x.id===id&&x.size===p.sizes[0]);if(found)found.qty++;else cart.push({id:p.id,name:p.name,price:p.price,image:p.images[0],size:p.sizes[0],qty:1});localStorage.setItem('stylecart_cart',JSON.stringify(cart));updateCount();alert('Added to bag. Default size '+p.sizes[0]+'. Open product details to choose another size.')}grid.innerHTML=products.map(p=>`<article class="productCard"><a href="product.html?id=${encodeURIComponent(p.id)}"><img src="${p.images[0]}" alt="${p.name}" loading="lazy"><h3>${p.name}</h3></a><p>${p.category} · <span class="price">₹${p.price.toLocaleString('en-IN')}</span></p><div class="cardActions"><a class="smallBtn" href="product.html?id=${encodeURIComponent(p.id)}">View details</a><button class="smallBtn primary" onclick="addToCart('${p.id}')">Quick add</button></div></article>`).join('');updateCount();
</script>
</body></html>
