<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | StyleCart</title><style>
:root{--ink:#1f2523;--muted:#737b76;--cream:#f7f5ef;--line:#e7e4dc;--green:#244b3b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.topbar{height:70px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:800}.brand span{color:#66866e}.secure{font-size:12px;color:var(--muted)}.wrap{padding:40px 7% 70px;max-width:1100px;margin:auto}.heading h1{font-size:38px;letter-spacing:-1.5px;margin:8px 0}.eyebrow{font-size:11px;letter-spacing:2px;color:#66866e;font-weight:700}.muted,.fine{color:var(--muted);font-size:13px;line-height:1.6}.checkoutGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:45px;margin-top:28px}form{display:flex;flex-direction:column;gap:16px}form>label,.two>label{display:flex;flex-direction:column;gap:8px;font-size:12px;font-weight:700}input:not([type=checkbox]):not([type=radio]),textarea{width:100%;border:1px solid #dcded8;padding:13px 12px;font:14px Arial;background:#fff;border-radius:2px;outline-color:#66866e}textarea{resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}fieldset{border:1px solid var(--line);padding:16px}legend{font-size:12px;font-weight:700}.radio,.check{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:400}.button{border:0;background:var(--green);color:#fff;padding:16px;font-size:13px;cursor:pointer}.button:disabled{opacity:.6}.summary{background:var(--cream);padding:22px;height:max-content}.summary h2{font-size:18px;margin-top:0}.summaryRow{display:flex;justify-content:space-between;gap:15px;font-size:12px;margin:14px 0}.summaryRow span:first-child{max-width:70%}.total{border-top:1px solid #ddd;padding-top:15px;font-size:17px;font-weight:700}.fine{font-size:11px}.success{color:#246b43;background:#eef6ef;padding:14px;line-height:1.6}.error{color:#9b3027;background:#fff0ed;padding:14px;line-height:1.6}#message:empty{display:none}@media(max-width:700px){.wrap{padding:30px 5%}.checkoutGrid{grid-template-columns:1fr;gap:25px}.two{grid-template-columns:1fr}.heading h1{font-size:32px}}
</style></head><body><header class="topbar"><a class="brand" href="index.html">Style<span>Cart</span></a><span class="secure">Secure checkout</span></header><main class="wrap"><div class="heading"><p class="eyebrow">ALMOST YOURS</p><h1>Delivery details</h1><p class="muted">Enter your details so we know where to send your order.</p></div><div class="checkoutGrid"><form id="checkoutForm"><label>Full name<input name="name" required autocomplete="name" placeholder="Your full name"></label><label>Mobile number<input name="phone" type="tel" required pattern="[0-9 +()-]{10,15}" autocomplete="tel" placeholder="10-digit mobile number"></label><label>Full address<textarea name="address" required rows="3" autocomplete="street-address" placeholder="House no., street, area"></textarea></label><div class="two"><label>City<input name="city" required autocomplete="address-level2" placeholder="City"></label><label>PIN code<input name="pincode" required pattern="[0-9]{6}" inputmode="numeric" autocomplete="postal-code" placeholder="6-digit PIN"></label></div><label>Landmark (optional)<input name="landmark" placeholder="Nearby landmark"></label><fieldset><legend>Payment method</legend><label class="radio"><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery (COD)</label></fieldset><label class="check"><input type="checkbox" required> I confirm my delivery details are correct.</label><button class="button" id="placeOrder" type="submit">Place COD order</button><p class="fine">Your order details are sent to the store to fulfil your purchase. Never enter bank PINs or OTPs here.</p><p id="message" role="status"></p></form><aside id="orderSummary" class="summary"></aside></div></main>
<script>
// Add/edit products here. Use image URLs that are publicly accessible online.
window.STYLECART_PRODUCTS = [
 {id:"shirt-01",name:"Classic Linen Shirt",category:"Shirts",price:1299,description:"A relaxed everyday shirt with a clean, breathable feel. Easy to style for work or weekends.",sizes:["S","M","L","XL"],images:["https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1603252109303-2751441dd157?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1598033129183-c4f50c736f10?auto=format&fit=crop&w=900&q=85"],color:"Olive"},
 {id:"tee-02",name:"Everyday Premium Tee",category:"T-shirts",price:699,description:"A versatile premium tee with a comfortable fit and minimal design.",sizes:["S","M","L","XL","XXL"],images:["https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=900&q=85"],color:"White"},

];
</script>

<script>
// IMPORTANT: paste your deployed Google Apps Script Web App URL below.
const ORDER_ENDPOINT = "PASTE_YOUR_WEB_APP_URL_HERE";
const form=document.getElementById('checkoutForm'),summary=document.getElementById('orderSummary'),message=document.getElementById('message'),button=document.getElementById('placeOrder');
function readCart(){try{return JSON.parse(localStorage.getItem('stylecart_cart')||'[]')}catch(e){return[]}}function money(n){return '₹'+Number(n).toLocaleString('en-IN')}function totalOf(c){return c.reduce((n,x)=>n+x.price*x.qty,0)}const initialCart=readCart();if(!initialCart.length){summary.innerHTML='<h2>Your order</h2><p>Your bag is empty.</p><a href="index.html"><u>Shop products</u></a>';button.disabled=true}else{summary.innerHTML='<h2>Your order</h2>'+initialCart.map(x=>`<div class="summaryRow"><span>${x.name} · ${x.size} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join('')+`<div class="summaryRow total"><span>Total</span><span>${money(totalOf(initialCart))}</span></div><p class="fine">Payment: Cash on Delivery</p>`}
form.addEventListener('submit',async e=>{e.preventDefault();const cart=readCart();if(!cart.length){message.className='error';message.textContent='Your bag is empty.';return}if(!ORDER_ENDPOINT.startsWith('https://script.google.com/macros/s/')||!ORDER_ENDPOINT.endsWith('/exec')){message.className='error';message.textContent='Order system is not connected yet. Add your deployed Apps Script Web App URL in checkout.js, then upload the files again.';return}const fd=new FormData(form);const orderId='SC'+Date.now().toString().slice(-9);const fullAddress=[fd.get('address'),fd.get('city'), 'PIN '+fd.get('pincode'),fd.get('landmark')].filter(Boolean).join(', ');const payload={orderId,name:fd.get('name'),phone:fd.get('phone'),address:fullAddress,products:cart.map(x=>`${x.name} (Size ${x.size}) x${x.qty}`).join('; '),total:totalOf(cart),payment:'Cash on Delivery'};button.disabled=true;button.textContent='Submitting order…';message.className='';message.textContent='';try{await fetch(ORDER_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});localStorage.setItem('stylecart_last_order',JSON.stringify({orderId,...payload}));localStorage.removeItem('stylecart_cart');location.href='success.html'}catch(err){button.disabled=false;button.textContent='Place COD order';message.className='error';message.textContent='Could not send the order. Check your internet connection and try again. If this continues, check the Apps Script deployment.'}});
</script>
</body></html>
