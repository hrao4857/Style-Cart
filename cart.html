<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Bag | StyleCart</title><style>
:root{--ink:#1f2523;--muted:#737b76;--cream:#f7f5ef;--line:#e7e4dc;--green:#244b3b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.topbar{height:70px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:800}.brand span{color:#66866e}nav{font-size:13px}.wrap{padding:45px 7%;max-width:1000px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;color:#66866e;font-weight:700}h1{font-size:38px;letter-spacing:-1.5px;margin:8px 0 30px}.cartRow{display:grid;grid-template-columns:100px 1fr auto;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}.cartRow img{width:100px;height:115px;object-fit:cover;background:var(--cream)}.cartRow h3{font-size:15px;margin:0 0 8px}.cartRow p{font-size:12px;color:var(--muted);margin:5px 0}.cartRow input{width:60px;padding:8px;border:1px solid var(--line)}.remove{border:0;background:none;color:#9b4b42;text-decoration:underline;font-size:12px;cursor:pointer;padding:8px 0}.summary{margin:28px 0 0 auto;max-width:360px;background:var(--cream);padding:24px}.sumLine{display:flex;justify-content:space-between;margin:10px 0;font-size:14px}.total{font-size:18px;font-weight:700;border-top:1px solid #ddd;padding-top:15px}.button{display:block;text-align:center;background:var(--green);color:#fff;padding:15px;margin-top:20px;font-size:13px}.empty{padding:35px;background:var(--cream);line-height:1.8}footer{padding:25px 7%;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}@media(max-width:600px){.wrap{padding:30px 5%}.cartRow{grid-template-columns:75px 1fr}.cartRow img{width:75px;height:95px}.rowPrice{grid-column:2}.summary{max-width:none}}
</style></head><body><header class="topbar"><a class="brand" href="index.html">Style<span>Cart</span></a><nav><a href="index.html">Continue shopping</a></nav></header><main class="wrap"><p class="eyebrow">YOUR SELECTION</p><h1>Your bag</h1><div id="cartItems"></div><div id="summary" class="summary"></div></main><footer>StyleCart · Good style. Simple shopping.</footer>
<script>
// Add/edit products here. Use image URLs that are publicly accessible online.
window.STYLECART_PRODUCTS = [
 {id:"shirt-01",name:"Classic Linen Shirt",category:"Shirts",price:1299,description:"A relaxed everyday shirt with a clean, breathable feel. Easy to style for work or weekends.",sizes:["S","M","L","XL"],images:["https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1603252109303-2751441dd157?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1598033129183-c4f50c736f10?auto=format&fit=crop&w=900&q=85"],color:"Olive"},
 {id:"tee-02",name:"Everyday Premium Tee",category:"T-shirts",price:699,description:"A versatile premium tee with a comfortable fit and minimal design.",sizes:["S","M","L","XL","XXL"],images:["https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=900&q=85"],color:"White"},
 {id:"jacket-03",name:"Utility Overshirt",category:"Outerwear",price:1799,description:"A smart layer with a modern silhouette. Wear it open or buttoned up.",sizes:["S","M","L","XL"],images:["https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1544923246-77307dd654cb?auto=format&fit=crop&w=900&q=85"],color:"Sand"},
 {id:"denim-04",name:"Relaxed Denim",category:"Bottoms",price:1499,description:"An easy relaxed cut made for everyday movement and effortless outfits.",sizes:["28","30","32","34","36"],images:["https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=900&q=85","https://images.unsplash.com/photo-1511196044526-5cb3bcb7071b?auto=format&fit=crop&w=900&q=85"],color:"Blue"}
];
</script>

<script>
const root=document.getElementById('cartItems'),sum=document.getElementById('summary');function get(){try{return JSON.parse(localStorage.getItem('stylecart_cart')||'[]')}catch(e){return[]}}function save(c){localStorage.setItem('stylecart_cart',JSON.stringify(c));render()}function money(n){return '₹'+Number(n).toLocaleString('en-IN')}function render(){const c=get();if(!c.length){root.innerHTML='<div class="empty">Your bag is empty.<br><a href="index.html"><u>Explore the collection →</u></a></div>';sum.innerHTML='';return}root.innerHTML=c.map((x,i)=>`<article class="cartRow"><img src="${x.image}" alt="${x.name}"><div><h3>${x.name}</h3><p>Size: ${x.size}</p><p>${money(x.price)} each</p><label>Qty <input type="number" min="1" max="10" value="${x.qty}" data-qty="${i}"></label><br><button class="remove" data-remove="${i}">Remove</button></div><div class="rowPrice"><b>${money(x.price*x.qty)}</b></div></article>`).join('');const total=c.reduce((n,x)=>n+x.price*x.qty,0);sum.innerHTML=`<div class="sumLine"><span>Subtotal</span><b>${money(total)}</b></div><div class="sumLine"><span>Delivery</span><span>Calculated at checkout</span></div><div class="sumLine total"><span>Total</span><span>${money(total)}</span></div><a class="button" href="checkout.html">Proceed to checkout →</a>`;root.querySelectorAll('[data-qty]').forEach(e=>e.addEventListener('change',()=>{const a=get();a[+e.dataset.qty].qty=Math.max(1,Math.min(10,parseInt(e.value)||1));save(a)}));root.querySelectorAll('[data-remove]').forEach(e=>e.addEventListener('click',()=>{const a=get();a.splice(+e.dataset.remove,1);save(a)}))}render();
</script>
</body></html>
